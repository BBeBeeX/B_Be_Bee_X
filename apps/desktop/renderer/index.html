<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strict CSP. `BBeBee-plugin:` is listed ahead of M5's dynamic loader
         (docs/03 §6.2) so the policy does not have to change to enable it.
         `'wasm-unsafe-eval'` is what lets QuickJS compile, and is not
         `'unsafe-eval'`: no foreign JavaScript loads (docs/02 §2). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' BBeBee-plugin:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: bbebee-file: https:; media-src 'self' blob: data: http: https: bbebee-file:; connect-src 'self' ws: wss: http: https:"
    />
    <script>
      (function () {
        if (location.search.includes('desktop-lyrics') || location.hash.includes('desktop-lyrics')) {
          document.documentElement.classList.add('is-lyrics-window')
          document.documentElement.style.background = 'transparent'
        }
        if (location.search.includes('mini-player') || location.hash.includes('mini-player')) {
          document.documentElement.classList.add('is-mini-player-window')
          document.documentElement.style.background = 'transparent'
        }
      })()
    </script>
    <title>BBeBee</title>
    <link rel="icon" type="image/png" href="./assets/logo-badge.png" />
    <style>
      :root {
        color-scheme: dark;

        /* Background */
        --bg-app: #05060B;
        --bg-primary: #080A12;
        --bg-secondary: #0B0E18;
        --bg-tertiary: #0F1322;

        /* Surface */
        --surface-1: #0D101A;
        --surface-2: #111522;
        --surface-3: #151927;
        --surface-hover: #191E30;
        --surface-active: #1D2140;
        --surface-selected: rgba(99,102,241,0.12);

        /* Brand */
        --primary: #6366F1;
        --primary-active: #5865F2;
        --primary-hover: #818CF8;

        --accent: #A855F7;
        --accent-hover: #C084FC;

        /* Gradient */
        --gradient-brand: linear-gradient(135deg, #5865F2 0%, #6D5DF6 45%, #A855F7 100%);
        --gradient-progress: linear-gradient(90deg, #4F6BFF 0%, #6366F1 50%, #A855F7 100%);

        /* Text */
        --text-primary: #F5F7FF;
        --text-secondary: #C5CAD8;
        --text-tertiary: #8B92A6;
        --text-muted: #626A80;
        --text-disabled: #41485B;
        --text-placeholder: #596176;

        /* Border */
        --border-subtle: rgba(148,163,184,0.08);
        --border-default: rgba(148,163,184,0.14);
        --border-hover: rgba(99,102,241,0.30);
        --border-active: rgba(99,102,241,0.55);
        --border-focus: rgba(139,92,246,0.65);

        /* Semantic */
        --success: #22C55E;
        --warning: #F59E0B;
        --error: #EF4444;
        --info: #38BDF8;

        /* Music */
        --music-playing: #7C6CFF;
        --music-lyrics: #B7AFFF;
        --music-waveform: #6575FF;
        --music-waveform-active: #9B8CFF;

        /* Glow */
        --glow-xs: 0 0 6px rgba(99,102,241,0.10);
        --glow-sm: 0 0 10px rgba(99,102,241,0.16);
        --glow-md: 0 0 18px rgba(99,102,241,0.20);
        --glow-lg: 0 0 28px rgba(99,102,241,0.16);

        --slider-track-bg: var(--gradient-progress);
      }
      body { margin: 0; background: var(--bg-app); color: var(--text-primary); font-family: system-ui, sans-serif; }
      html.is-mini-player-window,
      body.is-mini-player-window,
      html.is-lyrics-window,
      body.is-lyrics-window {
        background: transparent !important;
        background-color: transparent !important;
      }

      /* Global sleek, transparent, ultra-narrow scrollbars */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.2) transparent;
      }
      *::-webkit-scrollbar {
        width: 4px;
        height: 4px;
        background: transparent;
      }
      *::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track-piece,
      *::-webkit-scrollbar-corner {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.2);
        border-radius: 4px;
        transition: background-color 0.15s ease;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.45);
      }
      *::-webkit-scrollbar-thumb:active {
        background: rgba(99, 102, 241, 0.7);
      }

      /* Global progress & slider bars: thin track, thumb only visible on hover */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 12px;
        background: transparent;
        cursor: pointer;
        outline: none;
        margin: 0;
        padding: 0;
        vertical-align: middle;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 1.5px;
        background: var(--slider-track-bg, rgba(255, 255, 255, 0.2));
        transition: height 0.15s ease;
      }
      input[type="range"]:hover::-webkit-slider-runnable-track,
      input[type="range"]:active::-webkit-slider-runnable-track,
      input[type="range"].is-dragging::-webkit-slider-runnable-track {
        height: 3.5px;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #FFFFFF;
        margin-top: -3.5px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      input[type="range"]:hover::-webkit-slider-thumb,
      input[type="range"]:active::-webkit-slider-thumb,
      input[type="range"]:focus-visible::-webkit-slider-thumb,
      input[type="range"].is-dragging::-webkit-slider-thumb {
        opacity: 1;
      }

      /* Immersive panes scroll when they must, but never show a scrollbar. */
      .no-scrollbar { scrollbar-width: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
