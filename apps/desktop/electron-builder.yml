# Desktop packaging.
#
# `asarUnpack` is the load-bearing rule, not decoration: Windows cannot dlopen
# a native addon out of an asar archive, and the WASAPI exclusive driver
# (`@BBeBee/core-audio-wasapi-native`) is exactly that. The loader in
# `core-audio-wasapi-native/src/index.ts` probes `app.asar.unpacked/…` paths
# beside the in-asar ones — this pattern is what puts the file there. Without
# it the driver silently fails to load and every session degrades to shared
# output, which looks like a bug report about sound quality, not packaging.
#
# The rest is the minimum electron-builder needs to run a `--dir` build; fill
# in signing and publish targets here when releases are cut.
appId: org.bbebee.desktop
productName: BBeBee
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - "node_modules/@BBeBee/core-audio-wasapi-native/**"
